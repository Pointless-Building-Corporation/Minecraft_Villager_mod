name: CI Build & Validate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Validate Java Compilation
        run: ./gradlew --no-build-cache compileJava --stacktrace

      - name: Build Mod & Run Tests
        run: ./gradlew --no-build-cache build --stacktrace

      - name: Upload Build Artifacts (JARs)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bettervillagers-artifacts-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 14